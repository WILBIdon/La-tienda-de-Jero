<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Jero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-10">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg rounded-b-[2rem] z-50 text-center">
        <h1 class="text-2xl font-black italic">La Tienda de Jero</h1>
        <p class="text-[10px] uppercase font-bold tracking-widest opacity-80">Sincronización en Tiempo Real</p>
    </header>

    <main class="p-4 max-w-lg mx-auto" id="app">
        <div id="loader" class="text-center py-20 text-slate-400 font-bold">Conectando con Google Sheets...</div>
        <div id="productGrid" class="space-y-4"></div>
    </main>

    <script>
        // PEGA AQUÍ LA URL QUE COPIASTE DEL PASO ANTERIOR
        const GAS_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

        async function syncData() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                render(data);
            } catch (e) {
                document.getElementById('app').innerHTML = `<div class="bg-red-50 p-6 rounded-3xl text-red-700 text-center">Error al leer la hoja de cálculo</div>`;
            }
        }

        function render(items) {
            const grid = document.getElementById('productGrid');
            document.getElementById('loader').classList.add('hidden');
            
            grid.innerHTML = items.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">${i.Producto}</h3>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Costo: $${parseInt(i['P. Compra (Costo)'] || 0).toLocaleString()}</p>
                        </div>
                        <p class="text-indigo-600 font-black text-xl">$${parseInt(i['P. Venta'] || 0).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-50">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-slate-400 font-bold uppercase">Stock</span>
                            <span class="text-2xl font-black ${parseInt(i.Stock) < 5 ? 'text-red-600 animate-pulse' : 'text-slate-700'}">${i.Stock}</span>
                        </div>
                        <button onclick="updateStock('${i.Producto}', ${i.Stock})" class="bg-red-500 text-white px-8 py-3 rounded-2xl font-black text-xs active:scale-95 shadow-md uppercase">Vender -1</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStock(nombre, actual) {
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Importante para evitar bloqueos CORS en Apps Script
                    body: JSON.stringify({ producto: nombre, nuevoStock: actual - 1 })
                });
                // Recarga optimista
                setTimeout(syncData, 500);
            } catch (e) {
                alert("Error al actualizar");
            }
        }

        window.onload = syncData;
    </script>
</body>
</html>
