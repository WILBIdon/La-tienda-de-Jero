<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Tienda de Jero - POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .modal-overlay { backdrop-filter: blur(5px); }
        .cart-bar { transform: translateY(150%); transition: transform 0.3s ease-out; }
        .cart-bar.active { transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-32 relative">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg z-50">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic">La Tienda de Jero</h1>
                <p id="mode-text" class="text-[10px] uppercase font-bold tracking-widest text-indigo-200">Terminal de Ventas</p>
            </div>
            <button onclick="syncData()" class="bg-indigo-600 p-3 rounded-2xl active:scale-90 transition-all shadow-md">
                <i id="sync-icon" class="bi bi-arrow-repeat text-xl inline-block transition-transform"></i>
            </button>
        </div>
        <!-- Pestañas -->
        <div class="max-w-lg mx-auto flex mt-6 bg-indigo-800 rounded-xl p-1 gap-1">
            <button onclick="setMode('venta')" id="tab-venta" class="flex-1 py-2 font-bold text-xs uppercase rounded-lg bg-white text-indigo-900 transition-all shadow-sm">
                Ventas
            </button>
            <button onclick="setMode('gestion')" id="tab-gestion" class="flex-1 py-2 font-bold text-xs uppercase rounded-lg text-indigo-200 transition-all">
                Gestión
            </button>
            <button onclick="setMode('historial')" id="tab-historial" class="flex-1 py-2 font-bold text-xs uppercase rounded-lg text-indigo-200 transition-all">
                Historial
            </button>
        </div>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <!-- Búsqueda (Solo en Ventas y Gestión) -->
        <div class="relative mb-6 z-30" id="search-container">
            <i class="bi bi-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="renderCurrentMode()" 
                placeholder="Buscar producto..." 
                class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 shadow-sm focus:ring-4 focus:ring-indigo-500/20 outline-none text-sm font-bold text-slate-700">
        </div>

        <div id="loader" class="text-center py-20 text-slate-400 font-bold hidden">Sincronizando...</div>
        <div id="grid" class="space-y-4"></div>
    </main>

    <!-- Barra de Carrito Flotante (Solo en modo Ventas) -->
    <div id="cart-bar" class="cart-bar fixed bottom-0 left-0 w-full bg-slate-900 text-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] z-50 p-6 flex justify-between items-center hidden">
        <div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block">Total <span id="cart-qty" class="text-white ml-1"></span></span>
            <p id="cart-total" class="text-2xl font-black text-green-400">$0</p>
        </div>
        <div class="flex gap-2">
            <button onclick="clearCart()" class="bg-slate-700 p-3 rounded-2xl active:scale-95 text-slate-300">
                <i class="bi bi-trash-fill"></i>
            </button>
            <button onclick="checkoutCart()" id="btn-checkout" class="bg-green-500 px-6 py-3 rounded-2xl font-black uppercase text-sm active:scale-95 shadow-lg shadow-green-500/30 flex items-center gap-2">
                Cobrar <i class="bi bi-check-circle-fill"></i>
            </button>
        </div>
    </div>

    <!-- Botón FLOTANTE CREAR (Solo en Gestión) -->
    <button id="fab-create" onclick="openModal()" class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full items-center justify-center shadow-2xl z-40 active:scale-95 transition-all text-2xl border-4 border-white">
        <i class="bi bi-plus-lg"></i>
    </button>

    <!-- Modal Nuevo Producto -->
    <div id="modal-create" class="fixed inset-0 bg-slate-900/40 modal-overlay z-[100] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <!-- Contenido del modal se mantiene igual -->
        <div class="bg-white rounded-[2rem] w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800">Nuevo Producto</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 text-2xl"><i class="bi bi-x-circle-fill"></i></button>
            </div>
            <form id="createForm" onsubmit="createProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del producto</label>
                    <input type="text" id="p-nombre" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">P. Compra</label>
                        <input type="number" id="p-costo" required min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">P. Venta</label>
                        <input type="number" id="p-venta" required min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 text-indigo-600 font-black">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Stock Inicial</label>
                    <input type="number" id="p-stock" required min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700">
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-indigo-600 text-white rounded-xl py-4 font-black uppercase text-sm mt-4 shadow-lg shadow-indigo-200 active:scale-95 transition-all">Guardar</button>
            </form>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbySOa9gIjlatBuXjzn8zpBJEbQg8Rc1dqaxOVXJuA2IzOx0haMoI-oSQOxLYuulIJ_V/exec";
        
        let inventory = [];
        let historial = [];
        let cart = {}; // { "Arroz": { qty: 2, price: 3000 } }
        let currentMode = 'venta';

        // -------- GESTIÓN DE PESTAÑAS --------
        function setMode(mode) {
            currentMode = mode;
            ['venta', 'gestion', 'historial'].forEach(m => {
                const btn = document.getElementById('tab-' + m);
                if (m === mode) {
                    btn.className = "flex-1 py-2 font-bold text-xs uppercase rounded-lg bg-white text-indigo-900 transition-all shadow-sm";
                } else {
                    btn.className = "flex-1 py-2 font-bold text-xs uppercase rounded-lg text-indigo-200 transition-all";
                }
            });

            document.getElementById('search-container').style.display = mode === 'historial' ? 'none' : 'block';
            document.getElementById('mode-text').innerText = 
                 mode === 'venta' ? 'Punto de Venta 🛒' 
               : mode === 'gestion' ? 'Control de Stock 📦' 
               : 'Auditoría de Ventas 📊';

            const fab = document.getElementById('fab-create');
            if(mode === 'gestion') {
                fab.classList.remove('hidden');
                fab.classList.add('flex');
            } else {
                fab.classList.add('hidden');
                fab.classList.remove('flex');
            }

            renderCurrentMode();
            updateCartUI(); 
        }

        async function syncData() {
            const grid = document.getElementById('grid');
            const loader = document.getElementById('loader');
            const syncIcon = document.getElementById('sync-icon');
            
            grid.innerHTML = '';
            loader.classList.remove('hidden');
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const response = await fetch(GAS_URL);
                if(!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                
                inventory = data.inventario || [];
                historial = data.historial || [];
                renderCurrentMode();
            } catch (e) {
                grid.innerHTML = `<div class="bg-red-50 p-6 rounded-3xl border border-red-200 text-center"><p class="text-red-700 font-bold">${e.message}</p></div>`;
            } finally {
                loader.classList.add('hidden');
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }

        function renderCurrentMode() {
            const query = (document.getElementById('searchInput').value || "").toLowerCase();
            const filteredInventory = inventory.filter(p => (p.Producto || "").toLowerCase().includes(query));
            
            document.getElementById('loader').classList.add('hidden');
            const grid = document.getElementById('grid');

            if (currentMode === 'venta') renderVentas(filteredInventory, grid);
            else if (currentMode === 'gestion') renderGestion(filteredInventory, grid);
            else renderHistorial(grid);
        }

        // -------- RENDER VENTA (POS) --------
        function renderVentas(items, container) {
            if(!items.length) { container.innerHTML = '<p class="text-center text-slate-400 font-bold pt-10">No hay productos</p>'; return; }
            
            container.innerHTML = items.map(i => {
                const stock = parseInt(i.Stock || 0);
                const isOutOfStock = stock <= 0;
                const price = parseInt(i['P. Venta'] || 0);
                const inCart = cart[i.Producto]?.qty || 0;

                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border ${inCart > 0 ? 'border-indigo-500 bg-indigo-50/30' : 'border-slate-100'} transition-all flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-slate-800 text-lg leading-tight mb-1">${i.Producto}</h3>
                        ${inCart > 0 ? `<span class="bg-indigo-600 text-white text-[10px] font-black px-2 py-1 rounded-md">EN CARRITO (${inCart})</span>` : ''}
                        <p class="text-xs text-slate-400 font-bold uppercase block mt-1">Stock: <span class="${stock <= 5 ? 'text-red-500' : 'text-slate-600'}">${stock}</span></p>
                    </div>
                    <button 
                        onclick="addToCart('${i.Producto}', ${price}, ${stock})"
                        ${isOutOfStock ? 'disabled' : ''}
                        class="${isOutOfStock ? 'bg-slate-100 text-slate-400' : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100'} px-6 py-4 rounded-2xl font-black text-sm active:scale-95 transition-all text-center min-w-[100px]">
                        $${price.toLocaleString()}
                    </button>
                </div>
                `;
            }).join('');
        }

        // -------- LÓGICA CARRITO --------
        function addToCart(producto, price, stock) {
            if(!cart[producto]) cart[producto] = { qty: 0, price: price };
            if(cart[producto].qty >= stock) {
                alert("Alcanzaste el máximo stock disponible.");
                return;
            }
            cart[producto].qty++;
            updateCartUI();
            renderCurrentMode(); // refrescar bordes
        }

        function clearCart() {
            if(confirm("¿Vaciar todo el carrito?")) {
                cart = {};
                updateCartUI();
                renderCurrentMode();
            }
        }

        function updateCartUI() {
            const bar = document.getElementById('cart-bar');
            if (currentMode !== 'venta') {
                bar.classList.remove('active', 'flex'); bar.classList.add('hidden');
                return;
            }

            let total = 0;
            let qty = 0;
            for(let p in cart) {
                total += (cart[p].qty * cart[p].price);
                qty += cart[p].qty;
            }

            if(qty > 0) {
                bar.classList.remove('hidden'); bar.classList.add('flex');
                setTimeout(() => bar.classList.add('active'), 10);
                document.getElementById('cart-total').innerText = '$' + total.toLocaleString();
                document.getElementById('cart-qty').innerText = `(${qty} items)`;
            } else {
                bar.classList.remove('active');
                setTimeout(() => { bar.classList.add('hidden'); bar.classList.remove('flex'); }, 300);
            }
        }

        async function checkoutCart() {
            const btn = document.getElementById('btn-checkout');
            btn.innerHTML = '<i class="bi bi-hourglass-split animate-spin"></i> Procesando...';
            
            // Armar payload
            let itemsPayload = [];
            for(let prod in cart) {
                itemsPayload.push({
                    producto: prod,
                    qty: cart[prod].qty,
                    precio: cart[prod].price,
                    subtotal: cart[prod].qty * cart[prod].price
                });
            }

            try {
                const rs = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "checkout", items: itemsPayload })
                });
                // Si pasa la red
                cart = {};
                updateCartUI();
                renderCurrentMode();
                await syncData(); // Bajar stock e historial fresh
                alert("¡Cobro exitoso registrada sin contraseña!");
            } catch(e) {
                alert("Error al procesar el pago.");
            } finally {
                btn.innerHTML = 'Cobrar <i class="bi bi-check-circle-fill"></i>';
            }
        }

        // -------- RENDER GESTIÓN (Protegida) --------
        function renderGestion(items, container) {
            if(!items.length) { container.innerHTML = '<p class="text-center text-slate-400 font-bold pt-10">No hay productos</p>'; return; }
            
            container.innerHTML = items.map(i => {
                const stock = parseInt(i.Stock || 0);

                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 transition-all hover:shadow-md relative">
                    <button onclick="reqPwd(() => deleteProduct('${i.Producto}'))" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 transition-colors">
                        <i class="bi bi-trash3-fill text-xl"></i>
                    </button>
                    <div class="mb-4 pr-10">
                        <h3 class="font-bold text-slate-800 text-lg leading-tight mb-1">${i.Producto}</h3>
                        <p class="text-xs text-slate-500 font-bold">Costo: $${parseInt(i['P. Compra (Costo)'] || 0).toLocaleString()} | Venta: $${parseInt(i['P. Venta'] || 0).toLocaleString()}</p>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-2xl flex items-center justify-between border border-slate-100">
                        <button onclick="reqPwd(() => manageStock('${i.Producto}', ${stock}, -1))" class="bg-white w-12 h-12 rounded-xl text-red-500 font-black shadow-sm flex items-center justify-center text-xl active:scale-90">-</button>
                        <div class="text-center">
                            <span class="text-[10px] text-slate-400 font-bold uppercase block -mb-1">Stock</span>
                            <span class="text-2xl font-black text-slate-700">${stock}</span>
                        </div>
                        <button onclick="reqPwd(() => manageStock('${i.Producto}', ${stock}, 1))" class="bg-indigo-500 w-12 h-12 rounded-xl text-white font-black shadow-md flex items-center justify-center text-xl active:scale-90">+</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // -------- RENDER HISTORIAL --------
        function renderHistorial(container) {
            if(!historial.length) { container.innerHTML = '<p class="text-center text-slate-400 font-bold pt-10">No hay ventas registradas</p>'; return; }
            
            // Agrupar por ID
            let groups = {};
            historial.forEach(h => {
                if(!groups[h.id]) groups[h.id] = { fecha: h.fecha, total: 0, items: [] };
                groups[h.id].items.push(h);
                groups[h.id].total += parseInt(h.subtotal || 0);
            });

            container.innerHTML = Object.keys(groups).map(id => {
                let sale = groups[id];
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-3 border-b border-slate-50 pb-3">
                        <div>
                            <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-mono">${id}</span>
                            <p class="text-xs font-bold text-slate-500 mt-2">${sale.fecha}</p>
                        </div>
                        <p class="text-green-600 font-black text-lg">$${sale.total.toLocaleString()}</p>
                    </div>
                    <ul class="mb-4 space-y-1">
                        ${sale.items.map(it => `
                          <li class="flex justify-between text-xs font-bold">
                            <span class="text-slate-600">${it.cantidad}x ${it.producto}</span>
                            <span class="text-slate-400">$${parseInt(it.subtotal).toLocaleString()}</span>
                          </li>
                        `).join('')}
                    </ul>
                    <button onclick="reqPwdHistorial(() => revertSale('${id}'))" class="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold text-xs uppercase hover:bg-red-100 transition-colors">
                        Revertir e Invalidar Venta
                    </button>
                </div>
                `;
            }).join('');
        }

        // -------- AUTORIZACIÓN --------
        function reqPwd(callback) {
            const p = prompt("ACCESO PROTEGIDO\nIngresa contraseña de Administrador (1234):");
            if(p === "1234") callback();
            else if(p !== null) alert("Clave denegada.");
        }
        function reqPwdHistorial(callback) {
            const p = prompt("AUDITORÍA DE VENTA\nIngresa contraseña especial (4321):");
            if(p === "4321") callback();
            else if(p !== null) alert("Clave denegada.");
        }

        // -------- REQUESTS BACKEND --------
        async function runGasAction(payload) {
            const syncIcon = document.getElementById('sync-icon');
            if(syncIcon) syncIcon.classList.add('animate-spin');
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                await syncData();
            } catch(e) { alert("Error de red."); } 
            finally { if(syncIcon) syncIcon.classList.remove('animate-spin'); }
        }

        function manageStock(producto, actualStock, delta) {
            runGasAction({ action: "gestionar_stock", producto: producto, nuevoStock: actualStock + delta });
        }
        function deleteProduct(producto) {
            if(confirm(`¿ELIMINAR DEFINITIVAMENTE '${producto}'?`)) {
                runGasAction({ action: "eliminar", producto: producto });
            }
        }
        function revertSale(id) {
            if(confirm("Se devolverá el stock y la venta desaparecerá. ¿Continuar?")) {
                runGasAction({ action: "revertir_venta", ventaId: id });
            }
        }
        
        // Crear Producto se mantiene con prompt de reqPwd
        async function createProduct(event) {
            event.preventDefault();
            const p = prompt("Seguridad Create Product\nIngresa contraseña (1234):");
            if (p !== "1234") { if(p!==null) alert("Clave incorrecta!"); return; }

            const payload = {
                action: 'crear',
                producto: document.getElementById('p-nombre').value,
                costo: document.getElementById('p-costo').value,
                venta: document.getElementById('p-venta').value,
                stockInicial: document.getElementById('p-stock').value
            };
            closeModal();
            runGasAction(payload);
        }

        function openModal() {
            document.getElementById('modal-create').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-create').classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }
        function closeModal() {
            document.getElementById('modal-create').classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('modal-create').classList.add('hidden');
                document.getElementById('createForm').reset();
            }, 300);
        }

        window.onload = syncData;
    </script>
</body>
</html>
