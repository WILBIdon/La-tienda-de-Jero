<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Tienda de Jero - Consola de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg z-50 rounded-b-[2.5rem]">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight">La Tienda de Jero</h1>
                <p id="modo-label" class="text-[10px] uppercase tracking-widest font-bold bg-indigo-600 px-2 py-1 rounded mt-1">Modo: Ventas 💰</p>
            </div>
            <button onclick="fetchInventory()" class="bg-indigo-600 p-3 rounded-2xl active:rotate-180 transition-all shadow-inner">
                <i class="bi bi-arrow-repeat text-xl"></i>
            </button>
        </div>
    </header>

    <div class="max-w-lg mx-auto bg-white flex mt-[-1rem] shadow-md rounded-xl overflow-hidden mb-4 border border-slate-200">
        <button onclick="setModo('venta')" id="btn-venta" class="flex-1 py-4 font-bold text-sm uppercase flex items-center justify-center gap-2 tab-active">
            <i class="bi bi-cart-check"></i> Venta
        </button>
        <button onclick="setModo('carga')" id="btn-carga" class="flex-1 py-4 font-bold text-sm uppercase flex items-center justify-center gap-2 text-slate-400">
            <i class="bi bi-box-seam"></i> Carga
        </button>
    </div>

    <main class="p-4 max-w-lg mx-auto">
        <div class="relative mb-6">
            <i class="bi bi-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="filterProducts()" 
                placeholder="Buscar producto..." 
                class="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-sm focus:ring-4 focus:ring-indigo-500/20 outline-none text-lg">
        </div>

        <div id="productGrid" class="space-y-4">
            </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 px-8 py-4 flex justify-between items-center z-50 shadow-2xl">
        <button class="flex flex-col items-center text-slate-400">
            <i class="bi bi-graph-up-arrow text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Caja</span>
        </button>

        <a href="https://wa.me/TU_NUMERO_BOT" class="bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl shadow-green-200 -mt-14 border-4 border-white active:scale-90 transition-all">
            <i class="bi bi-mic-fill text-3xl"></i>
        </a>

        <button onclick="location.reload()" class="flex flex-col items-center text-indigo-600">
            <i class="bi bi-house-door-fill text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Inicio</span>
        </button>
    </nav>

    <script>
        let inventory = [];
        let modoActual = 'venta'; // 'venta' o 'carga'

        const N8N_URL = "TU_WEBHOOK_N8N";

        function setModo(modo) {
            modoActual = modo;
            document.getElementById('modo-label').innerText = modo === 'venta' ? 'Modo: Ventas 💰' : 'Modo: Carga 📦';
            document.getElementById('btn-venta').className = modo === 'venta' ? 'flex-1 py-4 font-bold text-sm uppercase tab-active' : 'flex-1 py-4 font-bold text-sm uppercase text-slate-400';
            document.getElementById('btn-carga').className = modo === 'carga' ? 'flex-1 py-4 font-bold text-sm uppercase tab-active' : 'flex-1 py-4 font-bold text-sm uppercase text-slate-400';
            renderInventory(inventory);
        }

        async function fetchInventory() {
            // Datos de prueba (Aquí conectarás tu n8n para leer Google Sheets)
            inventory = [
                { nombre: "Arroz Diana 1lb", pCompra: 2900, pVenta: 3800, stock: 25 },
                { nombre: "Leche Colanta 1L", pCompra: 3400, pVenta: 4500, stock: 4 },
                { nombre: "Aceite Gourmet 500ml", pCompra: 10200, pVenta: 13500, stock: 8 }
            ];
            renderInventory(inventory);
        }

        function renderInventory(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(item => {
                const esBajoStock = item.stock < 5;
                const colorBoton = modoActual === 'venta' ? 'bg-red-500' : 'bg-green-500';
                const textoBoton = modoActual === 'venta' ? 'VENDER -1' : 'CARGAR +1';
                
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start mb-3">
                        <div class="max-w-[60%]">
                            <h3 class="font-bold text-slate-800 text-lg leading-tight">${item.nombre}</h3>
                            <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">P. Compra: $${item.pCompra.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-indigo-600 font-black text-xl leading-none">$${item.pVenta.toLocaleString()}</p>
                            <span class="text-[10px] text-slate-400 font-bold uppercase">Precio Venta</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-4 pt-3 border-t border-slate-50">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Stock actual</span>
                            <span class="text-2xl font-black ${esBajoStock ? 'text-red-600 animate-pulse' : 'text-slate-700'}">${item.stock}</span>
                        </div>
                        <button onclick="procesarMovimiento('${item.nombre}', ${modoActual === 'venta' ? -1 : 1})" 
                                class="${colorBoton} text-white px-6 py-3 rounded-2xl font-black text-sm shadow-lg active:scale-95 transition-all">
                            ${textoBoton}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function procesarMovimiento(productName, delta) {
            const item = inventory.find(p => p.nombre === productName);
            if (!item) return;

            // Actualización visual rápida
            item.stock += delta;
            renderInventory(inventory);

            // Enviar a n8n
            try {
                await fetch(N8N_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        tipo: modoActual, // 'venta' o 'carga'
                        producto: productName,
                        cantidad: Math.abs(delta),
                        nuevoStock: item.stock,
                        precio_aplicado: modoActual === 'venta' ? item.pVenta : item.pCompra,
                        timestamp: new Date().toISOString()
                    })
                });
            } catch (e) { console.error("Error sincronizando"); }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventory.filter(p => p.nombre.toLowerCase().includes(query));
            renderInventory(filtered);
        }

        window.onload = fetchInventory;
    </script>
</body>
</html>
