<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Tienda de Jero - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 font-sans">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg z-50 rounded-b-[2rem]">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight">La Tienda de Jero</h1>
                <p id="modo-label" class="text-[10px] uppercase tracking-widest font-bold bg-indigo-600 px-2 py-1 rounded mt-1">
                    Operación: VENTAS 💰
                </p>
            </div>
            <button onclick="fetchInventory()" class="bg-indigo-600 p-3 rounded-2xl hover:bg-indigo-500 transition-all active:scale-90">
                <i class="bi bi-arrow-repeat text-xl"></i>
            </button>
        </div>
    </header>

    <div class="max-w-lg mx-auto bg-white flex mt-[-1rem] shadow-md rounded-2xl overflow-hidden mb-6 border border-slate-200">
        <button onclick="setModo('venta')" id="btn-venta" class="flex-1 py-4 font-bold text-xs uppercase flex items-center justify-center gap-2 tab-active transition-all">
            <i class="bi bi-cart-check-fill"></i> Registrar Venta
        </button>
        <button onclick="setModo('carga')" id="btn-carga" class="flex-1 py-4 font-bold text-xs uppercase flex items-center justify-center gap-2 text-slate-400 transition-all">
            <i class="bi bi-box-seam-fill"></i> Cargar Stock
        </button>
    </div>

    <main class="p-4 max-w-lg mx-auto">
        <div class="relative mb-8">
            <i class="bi bi-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="filterProducts()" 
                placeholder="Buscar por nombre..." 
                class="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-sm focus:ring-4 focus:ring-indigo-500/20 outline-none text-lg">
        </div>

        <div id="productGrid" class="space-y-4">
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-4"></div>
                <p class="font-bold">Sincronizando inventario...</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-200 px-10 py-4 flex justify-between items-center z-50 shadow-2xl">
        <button class="flex flex-col items-center text-slate-400">
            <i class="bi bi-bar-chart-fill text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Reportes</span>
        </button>

        <button onclick="location.reload()" class="flex flex-col items-center text-indigo-600">
            <i class="bi bi-house-door-fill text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Inicio</span>
        </button>
    </nav>

    <script>
        // CONFIGURACIÓN DE CONEXIÓN
        const BASE_URL = "https://la-tienda-de-jero-production.up.railway.app";
        const WEBHOOK_GET = `${BASE_URL}/webhook/leer-inventario`;
        const WEBHOOK_POST = `${BASE_URL}/webhook/actualizar-app`;

        let inventory = [];
        let modoActual = 'venta';

        // CARGAR DATOS DESDE N8N
        async function fetchInventory() {
            try {
                const response = await fetch(WEBHOOK_GET);
                if (!response.ok) throw new Error();
                inventory = await response.json();
                renderInventory(inventory);
            } catch (e) {
                document.getElementById('productGrid').innerHTML = `
                    <div class="bg-red-50 p-6 rounded-3xl border border-red-100 text-center">
                        <i class="bi bi-exclamation-triangle-fill text-red-500 text-3xl"></i>
                        <p class="text-red-700 font-bold mt-2">Error de conexión</p>
                        <p class="text-red-500 text-xs uppercase mt-1">Revisa que n8n esté activo</p>
                    </div>`;
            }
        }

        // CAMBIAR ENTRE VENTA Y CARGA
        function setModo(modo) {
            modoActual = modo;
            document.getElementById('modo-label').innerText = modo === 'venta' ? 'Operación: VENTAS 💰' : 'Operación: CARGA 📦';
            document.getElementById('btn-venta').className = modo === 'venta' ? 'flex-1 py-4 font-bold text-xs uppercase tab-active' : 'flex-1 py-4 font-bold text-xs uppercase text-slate-400';
            document.getElementById('btn-carga').className = modo === 'carga' ? 'flex-1 py-4 font-bold text-xs uppercase tab-active' : 'flex-1 py-4 font-bold text-xs uppercase text-slate-400';
            renderInventory(inventory);
        }

        // MOSTRAR PRODUCTOS
        function renderInventory(items) {
            const grid = document.getElementById('productGrid');
            if (items.length === 0) {
                grid.innerHTML = '<p class="text-center text-slate-400 py-10">No hay productos que coincidan.</p>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const stock = parseInt(item.Stock || 0);
                const precioCosto = parseInt(item['P. Compra (Costo)'] || 0).toLocaleString();
                const precioVenta = parseInt(item['P. Venta'] || 0).toLocaleString();
                const alertClass = stock <= 5 ? 'text-red-600 animate-pulse' : 'text-slate-700';

                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 hover:border-indigo-200 transition-all">
                    <div class="flex justify-between items-start mb-4">
                        <div class="max-w-[65%]">
                            <h3 class="font-bold text-slate-800 text-lg leading-tight truncate">${item.Producto}</h3>
                            <div class="flex gap-2 mt-2">
                                <span class="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded uppercase">Costo: $${precioCosto}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-indigo-600 font-black text-xl leading-none">$${precioVenta}</p>
                            <span class="text-[9px] font-bold text-slate-400 uppercase">Precio Venta</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-4 pt-4 border-t border-slate-50">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Stock actual</span>
                            <span class="text-2xl font-black ${alertClass}">${stock}</span>
                        </div>
                        <button onclick="procesarMovimiento('${item.Producto}', ${modoActual === 'venta' ? -1 : 1})" 
                                class="${modoActual === 'venta' ? 'bg-red-500 shadow-red-100' : 'bg-green-500 shadow-green-100'} 
                                text-white px-8 py-3 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all uppercase">
                            ${modoActual === 'venta' ? 'Vender -1' : 'Cargar +1'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // SINCRONIZAR MOVIMIENTO CON N8N
        async function procesarMovimiento(productName, delta) {
            const item = inventory.find(p => p.Producto === productName);
            if (!item) return;

            // Actualización visual inmediata (Optimistic UI)
            const stockAnterior = item.Stock;
            item.Stock = parseInt(item.Stock) + delta;
            renderInventory(inventory);

            try {
                const response = await fetch(WEBHOOK_POST, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        tipo: modoActual,
                        producto: productName,
                        cantidad: 1,
                        nuevoStock: item.Stock
                    })
                });

                if (!response.ok) throw new Error();
                console.log(`Sincronizado: ${productName}`);
            } catch (e) {
                alert("Error de red: No se pudo guardar en el Excel.");
                item.Stock = stockAnterior; // Revertir si falla
                renderInventory(inventory);
            }
        }

        // FILTRADO EN TIEMPO REAL
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventory.filter(p => p.Producto.toLowerCase().includes(query));
            renderInventory(filtered);
        }

        // INICIO
        window.onload = fetchInventory;
    </script>
</body>
</html>
