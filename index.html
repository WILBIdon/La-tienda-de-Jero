<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Tienda de Jero - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .product-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg z-50 rounded-b-[2rem]">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tighter">La Tienda de Jero</h1>
                <p class="text-[10px] uppercase tracking-widest opacity-80 font-bold">Panel de Inventario</p>
            </div>
            <button onclick="fetchInventory()" class="bg-indigo-600 p-3 rounded-2xl active:rotate-180 transition-all duration-500 shadow-inner">
                <i class="bi bi-arrow-repeat text-xl"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <div class="relative mb-6 -mt-2">
            <i class="bi bi-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="filterProducts()" 
                placeholder="¿Qué producto buscas?" 
                class="w-full pl-12 pr-4 py-4 rounded-2xl border-none shadow-xl focus:ring-4 focus:ring-indigo-500/20 outline-none text-lg">
        </div>

        <div id="productGrid" class="space-y-4">
            <div class="text-center py-20 text-slate-400 font-medium">Cargando inventario de Jero...</div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-200 px-8 py-4 flex justify-between items-center z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
        
        <button onclick="alert('Funcionalidad de creación en desarrollo')" class="flex flex-col items-center text-slate-400">
            <i class="bi bi-plus-circle text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Nuevo</span>
        </button>

        <a href="https://wa.me/TU_NUMERO_BOT" 
            class="bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl shadow-green-200 -mt-14 border-4 border-white active:scale-90 transition-all">
            <i class="bi bi-mic-fill text-3xl"></i>
        </a>

        <button onclick="location.reload()" class="flex flex-col items-center text-indigo-600">
            <i class="bi bi-house-door-fill text-2xl"></i>
            <span class="text-[10px] font-bold mt-1 uppercase">Inicio</span>
        </button>
    </nav>

    <script>
        // CONFIGURACIÓN: Reemplaza con tus Webhooks de n8n
        const WEBHOOK_GET = "TU_URL_N8N_PARA_LEER_EXCEL";
        const WEBHOOK_UPDATE = "TU_URL_N8N_PARA_ACTUALIZAR_EXCEL";

        let inventory = [];

        // 1. CARGAR INVENTARIO DESDE N8N (GOOGLE SHEETS)
        async function fetchInventory() {
            try {
                // Simulación de carga - Aquí conectarás tu nodo de Google Sheets de n8n
                // const response = await fetch(WEBHOOK_GET);
                // inventory = await response.json();
                
                // Datos de prueba iniciales
                inventory = [
                    { nombre: "Arroz Diana 1lb", precio: 3800, stock: 12 },
                    { nombre: "Leche Colanta 1L", precio: 4500, stock: 4 },
                    { nombre: "Aceite Gourmet 500ml", precio: 13500, stock: 8 },
                    { nombre: "Huevos AA x30", precio: 18000, stock: 2 }
                ];
                renderInventory(inventory);
            } catch (error) {
                console.error("Error cargando inventario:", error);
            }
        }

        // 2. MOSTRAR PRODUCTOS EN PANTALLA
        function renderInventory(items) {
            const grid = document.getElementById('productGrid');
            if(items.length === 0) {
                grid.innerHTML = `<p class="text-center text-slate-400">No se encontraron productos.</p>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="product-card bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center transition-all">
                    <div class="flex-1">
                        <h3 class="font-bold text-slate-800 text-lg leading-tight">${item.nombre}</h3>
                        <p class="text-indigo-600 font-black">$${item.precio.toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-100">
                        <button onclick="changeStock('${item.nombre}', -1)" class="w-10 h-10 bg-white rounded-xl shadow-sm flex items-center justify-center font-bold text-red-500 border border-slate-100 active:bg-red-50">-</button>
                        <span class="font-mono font-bold text-2xl min-w-[40px] text-center ${item.stock < 5 ? 'text-red-600 animate-pulse' : 'text-slate-700'}">${item.stock}</span>
                        <button onclick="changeStock('${item.nombre}', 1)" class="w-10 h-10 bg-white rounded-xl shadow-sm flex items-center justify-center font-bold text-green-600 border border-slate-100 active:bg-green-50">+</button>
                    </div>
                </div>
            `).join('');
        }

        // 3. FILTRADO MANUAL (BUSCADOR)
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventory.filter(p => p.nombre.toLowerCase().includes(query));
            renderInventory(filtered);
        }

        // 4. ACTUALIZAR STOCK EN GOOGLE SHEETS VÍA N8N
        async function changeStock(productName, delta) {
            // Actualización visual inmediata (Optimistic UI)
            const item = inventory.find(p => p.nombre === productName);
            if (item) {
                item.stock += delta;
                renderInventory(inventory);

                // Envío real a n8n
                try {
                    await fetch(WEBHOOK_UPDATE, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            producto: productName,
                            cambio: delta,
                            nuevoStock: item.stock,
                            origen: 'App Móvil Jero'
                        })
                    });
                } catch (e) {
                    console.error("Error sincronizando con n8n");
                }
            }
        }

        // Iniciar al cargar la página
        window.onload = fetchInventory;
    </script>
</body>
</html>
