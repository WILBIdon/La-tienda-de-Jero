<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Tienda de Jero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 font-sans">

    <header class="bg-indigo-700 text-white p-6 sticky top-0 shadow-lg z-50 rounded-b-[2rem]">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black">La Tienda de Jero</h1>
            <button onclick="fetchInventory()" class="bg-indigo-600 p-3 rounded-2xl active:scale-90 transition-all">
                <i class="bi bi-arrow-repeat text-xl"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <div id="productGrid" class="space-y-4">
            <div class="text-center py-20 text-slate-400">Iniciando conexión...</div>
        </div>
    </main>

    <script>
        const BASE_URL = window.location.origin;
        const WEBHOOK_GET = `${BASE_URL}/webhook/leer-inventario`;
        const WEBHOOK_POST = `${BASE_URL}/webhook/actualizar-app`;

        async function fetchInventory() {
            const grid = document.getElementById('productGrid');
            try {
                const response = await fetch(WEBHOOK_GET);
                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`Error en n8n: ${errorData}`);
                }
                const inventory = await response.json();
                renderInventory(inventory);
            } catch (e) {
                grid.innerHTML = `
                    <div class="bg-red-50 p-6 rounded-3xl border border-red-200 text-center">
                        <i class="bi bi-exclamation-octagon text-red-500 text-4xl"></i>
                        <p class="text-red-700 font-bold mt-2">Error de Sincronización</p>
                        <p class="text-red-500 text-[10px] mt-2 font-mono break-all">${e.message}</p>
                    </div>`;
            }
        }

        function renderInventory(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(item => {
                // FALLBACKS para nombres de columnas según tu captura 8.36.37
                const nombre = item.Producto || "Sin nombre";
                const costo = item['Compra (Costo)'] || item['P. Compra (Costo)'] || 0;
                const venta = item['P. Venta'] || 0;
                const stock = parseInt(item.Stock || 0);

                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-bold text-slate-800">${nombre}</h3>
                            <span class="text-[9px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 uppercase">Costo: $${parseInt(costo).toLocaleString()}</span>
                        </div>
                        <p class="text-indigo-600 font-black text-xl leading-none">$${parseInt(venta).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-slate-400 uppercase font-bold">Stock</span>
                            <span class="text-2xl font-black ${stock <= 5 ? 'text-red-600' : 'text-slate-700'}">${stock}</span>
                        </div>
                        <button onclick="registrar('${nombre}', -1)" class="bg-red-500 text-white px-8 py-3 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all">VENDER -1</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function registrar(prod, delta) {
            try {
                await fetch(WEBHOOK_POST, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tipo: 'venta', producto: prod, cantidad: 1 })
                });
                fetchInventory();
            } catch (e) { alert("Error al guardar venta"); }
        }

        window.onload = fetchInventory;
    </script>
</body>
</html>
