<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no'><title>La Tienda de Jero</title><script src='https://cdn.tailwindcss.com'></script><link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css'></head><body class='bg-slate-50 min-h-screen font-sans pb-24'><header class='bg-indigo-700 text-white p-6 sticky top-0 shadow-lg rounded-b-[2rem] z-50'><div class='max-w-lg mx-auto flex justify-between items-center'><h1 class='text-2xl font-black'>La Tienda de Jero</h1><button onclick='fetchInventory()' class='bg-indigo-600 p-3 rounded-2xl active:scale-90 transition-all'><i class='bi bi-arrow-repeat text-xl'></i></button></div></header><main class='p-4 max-w-lg mx-auto'><div id='app'><div class='text-center py-20 text-slate-400 font-bold'>Cargando inventario...</div></div></main><script>const API=window.location.origin+'/webhook/leer-inventario';const POST=window.location.origin+'/webhook/actualizar-app';let inv=[];function showError(msg){document.getElementById('app').innerHTML='<div class="bg-red-50 p-6 rounded-3xl border border-red-200 text-center"><i class="bi bi-bug-fill text-red-500 text-4xl"></i><p class="text-red-700 font-bold mt-3 text-lg">Error de Sincronización</p><div class="mt-3 p-3 bg-white rounded-xl text-xs font-mono text-red-600 text-left border border-red-100 overflow-auto max-h-32"><b>Detalle:</b><br>'+msg+'</div><button onclick="fetchInventory()" class="mt-4 bg-red-500 text-white px-6 py-2 rounded-xl font-bold text-sm">Reintentar</button></div>';}async function fetchInventory(){document.getElementById('app').innerHTML='<div class="text-center py-20 text-slate-400">Sincronizando...</div>';try{const r=await fetch(API);if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+': '+t);}inv=await r.json();if(!Array.isArray(inv))throw new Error('Respuesta inesperada del servidor');render();}catch(e){showError(e.message);}}function render(){if(!inv.length){document.getElementById('app').innerHTML='<div class="text-center py-20 text-slate-400">Sin productos</div>';return;}document.getElementById('app').innerHTML=inv.map(i=>{const stock=parseInt(i.Stock||0);return'<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-4"><div class="flex justify-between items-start mb-3"><div><h3 class="font-bold text-slate-800 text-lg">'+i.Producto+'</h3><p class="text-xs text-slate-400 font-bold uppercase">Costo: $'+parseInt(i["P. Compra (Costo)"]||i["Compra (Costo)"]||0).toLocaleString()+'</p></div><p class="text-indigo-600 font-black text-xl">$'+parseInt(i["P. Venta"]||0).toLocaleString()+'</p></div><div class="flex items-center justify-between pt-3 border-t"><div><span class="text-xs text-slate-400 font-bold uppercase block">Stock</span><span class="text-2xl font-black '+(stock<=5?'text-red-600 animate-pulse':'text-slate-700')+'">'+stock+'</span></div><button onclick="vender(\''+i.Producto+'\','+stock+')" '+(stock<=0?'disabled':'')+' class="bg-red-500 text-white px-8 py-3 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all disabled:opacity-40">VENDER -1</button></div></div>';}).join('');}async function vender(p,s){if(s<=0){alert('Sin stock');return;}try{const r=await fetch(POST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({producto:p,nuevoStock:s-1})});if(!r.ok)throw new Error('HTTP '+r.status);fetchInventory();}catch(e){alert('Error al guardar: '+e.message);}}window.onload=fetchInventory;</script></body></html>
